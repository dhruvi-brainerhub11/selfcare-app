services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: selfcare-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks:
      - selfcare-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: selfcare-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - selfcare-network

networks:
  selfcare-network:
    driver: bridge
